name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm run install:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Data check
        run: npm run data:check
      - name: Verify provenance chain
        run: npm run research:verify-provenance
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        # Chromium only: this project's `playwright.config.ts` runs a
        # Desktop Chromium project plus a Chromium-engine mobile-viewport
        # project (390x844) — there's no WebKit/Firefox-specific behavior
        # under test, so a second/third engine would only add install time
        # without added coverage.
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (Playwright)
        run: npm run e2e:ci
        env:
          CI: true
